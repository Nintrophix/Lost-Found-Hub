# Render Blueprint: https://render.com/docs/blueprint-spec
# In the Render dashboard choose New > Blueprint, connect this repository, and
# Render creates the web service below. You will be asked for the Supabase values.
services:
  - type: web
    name: lost-found-hub
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --omit=dev
    # Applies any new database migrations, then starts the site. Safe to run on every boot.
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # Supabase "Session pooler" connection string (IPv4), entered in the dashboard (never committed).
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: "5"
      # Supabase project URL and service role key, for photo storage. Secret: dashboard only.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: item-images
      # Random value generated by Render on first deploy.
      - key: SESSION_SECRET
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: "5"
      # Optional. Leave empty to use the onrender.com address; set it to
      # https://your-domain once a custom domain is connected.
      - key: SITE_URL
        sync: false
      - key: SITE_CONTACT_EMAIL
        sync: false
