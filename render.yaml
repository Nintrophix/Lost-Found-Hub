# Render Blueprint: https://render.com/docs/blueprint-spec
# In the Render dashboard choose New > Blueprint, connect this repository, and
# Render creates the web service below. You will be asked for MONGODB_URI.
services:
  - type: web
    name: lost-found-hub
    runtime: node
    plan: free
    branch: style
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # MongoDB Atlas connection string, entered in the dashboard (never committed).
      - key: MONGODB_URI
        sync: false
      # Random value generated by Render on first deploy.
      - key: SESSION_SECRET
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: "5"
      # Optional. Leave empty to use the onrender.com address; set it to
      # https://your-domain once a custom domain is connected.
      - key: SITE_URL
        sync: false
      - key: SITE_CONTACT_EMAIL
        sync: false
